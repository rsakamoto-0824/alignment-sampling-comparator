[project]
name = "alignment-sampling"
version = "0.1.0"
description = "アライメント計測Markの選び方の比較（ブラウザ版と同じ計算のPython版）"
requires-python = ">=3.14.5"
dependencies = [
    "numpy>=2.5",
    "matplotlib>=3.11",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alignment_sampling"]
